name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/lorenalgm/oficina-execucao-service

concurrency: deploy-execucao

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (2.40.0)
        with:
          php-version: '8.4'
          extensions: pdo, pdo_sqlite, zip, mbstring, bcmath, sockets, mongodb
          coverage: none

      - name: Dependências e ambiente
        run: |
          composer install --no-interaction
          cp .env.example .env
          php artisan key:generate

      - name: Testes
        run: php artisan test

  imagem:
    name: Imagem (GHCR)
    runs-on: ubuntu-latest
    needs: testes
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

  deploy:
    name: Deploy no EKS
    runs-on: ubuntu-latest
    needs: imagem
    environment: producao
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Kubeconfig
        run: aws eks update-kubeconfig --region "${{ vars.AWS_REGION || 'us-east-1' }}" --name "${{ vars.EKS_CLUSTER_NAME || 'oficina-eks' }}"

      - name: Secret do serviço
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          kubectl -n oficina create secret generic execucao-secrets \
            --from-literal=APP_KEY="$APP_KEY" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Manifestos e índices
        run: |
          kubectl -n oficina delete job execucao-indices --ignore-not-found
          kubectl kustomize k8s/ | sed "s#${IMAGE_NAME}:latest#${IMAGE_NAME}:${GITHUB_SHA}#g" | kubectl apply -f -
          kubectl -n oficina wait --for=condition=complete job/execucao-indices --timeout=300s

      - name: Rollout
        run: |
          kubectl -n oficina rollout status deployment/execucao-api --timeout=300s
          kubectl -n oficina rollout status deployment/execucao-worker --timeout=300s

      - name: Smoke test
        run: |
          kubectl -n oficina run execucao-smoke --image=curlimages/curl:8.11.1 --restart=Never --rm -i --quiet \
            --command -- curl -fsS http://execucao-api/up
