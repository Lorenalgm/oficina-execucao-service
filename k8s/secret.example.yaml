# Não entra no kustomization. Crie com valores reais:
#   kubectl -n oficina create secret generic execucao-secrets \
#     --from-literal=APP_KEY="$(php artisan key:generate --show)" \
#     --from-literal=JWT_SECRET=...   (o mesmo da Lambda e do OS Service)
apiVersion: v1
kind: Secret
metadata:
  name: execucao-secrets
type: Opaque
stringData:
  APP_KEY: "base64:SUBSTITUA"
  JWT_SECRET: "SUBSTITUA"
