services:
  app:
    build: .
    env_file: .env
    environment:
      MONGO_URI: mongodb://root:secret@mongo:27017/execucao?authSource=admin
    ports:
      - "8002:8080"
    depends_on:
      - mongo

  mongo:
    image: mongo:8.0
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: secret
    ports:
      - "27018:27017"
    volumes:
      - mongodata:/data/db

volumes:
  mongodata:
